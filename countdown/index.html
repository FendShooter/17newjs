<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="inputs">
        <label for="hourInputs">Hours:</label>
        <input type="number" id="hourInputs" min="0" value="0" />

        <label for="minutesInputs">Minutes:</label>
        <input type="number" id="minutesInputs" min="0" value="0" />
        <label for="secondInputs">Seconds:</label>
        <input type="number" id="secondInputs" min="0" value="0" />
        <button class="btn" id="startTimer">Start</button>
      </div>
      <div class="timerDisplay">
        <div id="hoursOutput"></div>
        <div id="minutesOutput"></div>
        <div id="secondsOutput"></div>
        <div class="btn-group">
          <!-- <button class="btn" id="stopTimer">Stop</button> -->
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
